<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pregações</h1>
    <h2><a href="{{ url_for('administrador.cadastrar_video') }}">Adicionar pregação</a></h2>
    {% for video in videos %}
    <div style="border: 1px solid gray;">
        
            <img style="width: 100px; height: 100px; border: 2px solid black;"  src="{{video.VIDEO_THUMBNAIL}}" alt="">
        
        <a href="{{video.VIDEO_URL}}"><h3>{{video.VIDEO_TITLE}}</h3></a>
        <p>{{video.VIDEO_DURATION}} segundos</p>
        <p>{{video.VIDEO_CATEGORY}}</p>
        <h5>Pregador: <span><p>{{video.VIDEO_PREACHER}}</p></span></h5>
        <br>
        <a href="{{ url_for('administrador.atualizar_video', video_id=video.VIDEO_ID) }}">Atualizar</a>
        <a href="#"
            class="link-excluir"
            data-url="{{ url_for('administrador.excluir_video', video_id=video.VIDEO_ID) }}"
            data-titulo="{{ video.VIDEO_TITLE }}">
                Excluir
        </a>
    </div>
    {% endfor %}
    <dialog id="dialogExcluir">
        <h3>Excluir video</h3>
        <p id="mensagemExcluir"></p>
        <button onclick="document.getElementById('dialogExcluir').close()">Cancelar</button>
        <button id="btnConfirmarExcluir" onclick="confirmarExclusao()">Excluir</button>
    </dialog>

    <script>
        let urlExclusaoAtual = null;

        // Abre o dialog de confirmação, guardando a URL de exclusão que será usada no fetch
        function abrirDialog(url, titulo) {
            urlExclusaoAtual = url;
            document.getElementById("mensagemExcluir").textContent =
                `Tem certeza que deseja excluir "${titulo}"?`;
            document.getElementById("dialogExcluir").showModal();
        }

        // Envia a exclusão via fetch e recarrega a página ao concluir
        function confirmarExclusao() {
            window.location.href = urlExclusaoAtual;
        }

        // Liga o clique de cada link "Excluir" à função abrirDialog, lendo os dados via data-attributes
        document.querySelectorAll(".link-excluir").forEach(function (link) {
            link.addEventListener("click", function (event) {
                event.preventDefault();
                abrirDialog(link.dataset.url, link.dataset.titulo);
            });
        });
    </script>
    
</body>
</html>
